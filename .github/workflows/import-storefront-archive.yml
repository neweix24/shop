name: Import uploaded storefront archive

on:
  workflow_dispatch:
    inputs:
      archive_path:
        description: Repository-relative path to the uploaded ZIP archive
        required: true
        default: code.zip
      destination:
        description: Repository-relative destination directory
        required: true
        default: .

permissions:
  contents: write

concurrency:
  group: storefront-archive-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate and extract source archive
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile, shutil, sys
          archive = pathlib.Path(os.environ["ARCHIVE_PATH"]).resolve()
          root = pathlib.Path.cwd().resolve()
          dest_arg = pathlib.Path(os.environ["DESTINATION"])
          dest = (root / dest_arg).resolve()
          if root not in archive.parents or not archive.is_file():
              raise SystemExit("Archive path does not point to a file inside this checkout.")
          if root not in dest.parents and dest != root:
              raise SystemExit("Destination must stay inside the repository.")
          if not zipfile.is_zipfile(archive):
              raise SystemExit("The selected file is not a valid ZIP archive.")
          excluded = {
              "neweix-source.zip",
              "neweix-source.tar.gz",
              "client/public/__manus__/debug-collector.js",
              "vite.config.ts.bak",
          }
          staged = pathlib.Path("/tmp/neweix-shop-import")
          shutil.rmtree(staged, ignore_errors=True)
          staged.mkdir(parents=True)
          imported = []
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  if not name or name.endswith("/"):
                      continue
                  if name in excluded or any(part in {".git", "node_modules", "dist", ".manus-logs"} for part in p.parts):
                      continue
                  if p.name == ".env" or (p.name.startswith(".env.") and p.name != ".env.example"):
                      continue
                  target = staged.joinpath(*p.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as out:
                      shutil.copyfileobj(src, out)
                  imported.append(p.as_posix())
          if not imported:
              raise SystemExit("No importable source files were found.")
          conflicts = [name for name in imported if (dest / name).exists()]
          if conflicts:
              print("Import stopped. These paths already exist and will not be overwritten:")
              print("\n".join(conflicts))
              raise SystemExit(2)
          for name in imported:
              target = dest / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(staged / name, target)
          pathlib.Path("/tmp/neweix-shop-import-count").write_text(str(len(imported)))
          archive.unlink()
          print(f"Safely imported {len(imported)} files; removed the uploaded ZIP from the repository.")
          PY

      - name: Commit imported storefront source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "feat(shop): import uploaded storefront source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
