name: Import Shop ZIP source

on:
  workflow_dispatch:
  push:
    branches: [neweix24-patch-1]
    paths:
      - code.zip
      - .github/workflows/import-shop-zip.yml

permissions:
  contents: write

concurrency:
  group: shop-zip-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: neweix24-patch-1
          fetch-depth: 0

      - name: Validate and extract archive
        shell: bash
        run: |
          set -euo pipefail
          test -s code.zip
          unzip -tq code.zip
          rm -rf /tmp/shop-archive source-import
          mkdir -p /tmp/shop-archive source-import
          unzip -q code.zip -d /tmp/shop-archive

          # Find the project root even when the ZIP contains one wrapper directory.
          if [ -f /tmp/shop-archive/package.json ]; then
            ROOT=/tmp/shop-archive
          else
            mapfile -t manifests < <(find /tmp/shop-archive -mindepth 2 -maxdepth 4 -type f -name package.json -not -path '*/node_modules/*' | sort)
            if [ "${#manifests[@]}" -ne 1 ]; then
              echo "Expected exactly one project package.json; found ${#manifests[@]}."
              printf '%s\n' "${manifests[@]}"
              exit 1
            fi
            ROOT="$(dirname "${manifests[0]}")"
          fi

          # Never import credentials, nested archives, generated output, or VCS metadata.
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            --exclude='/dist/' \
            --exclude='/build/' \
            --exclude='/.manus-logs/' \
            --include='/.env.example' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            --exclude='*.bak' \
            --exclude='debug-collector.js' \
            "${ROOT}/" source-import/
          test -s source-import/package.json
          echo "Imported project root: ${ROOT}"
          find source-import -maxdepth 2 -type f | sort | head -200

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-import
          if ! git diff --cached --quiet; then
            git commit -m 'Import storefront source from uploaded ZIP'
            git push origin HEAD:neweix24-patch-1
          else
            echo 'No source changes to import.'
          fi

      - name: Install dependencies with the committed lockfile
        working-directory: source-import
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version
          test -s pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Run available validation scripts
        working-directory: source-import
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          for task in typecheck check lint test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$task'] ? 0 : 1)"; then
              pnpm run "$task"
            else
              echo "Skipping missing script: $task"
            fi
          done
