name: Shop Next.js and NestJS workspace validation

on:
  push:
    branches:
      - feat/shop-ecosystem-remediation
    paths:
      - application/**
      - .github/workflows/validate-shop-application.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shop-application-validation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install pinned pnpm
        run: |
          npm install --global pnpm@10.18.0
          pnpm --version

      - name: Generate workspace lockfile
        working-directory: application
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Persist generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add application/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'build(shop): generate Next and Nest workspace lockfile'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Workspace lockfile is already current.'
          fi

      - name: Install exact locked dependencies
        working-directory: application
        run: pnpm install --frozen-lockfile

      - name: TypeScript checks
        working-directory: application
        run: pnpm check

      - name: Unit tests
        working-directory: application
        run: pnpm test

      - name: Production builds
        working-directory: application
        run: pnpm build

      - name: Build the NestJS API container image
        run: docker build --file application/Dockerfile.api --tag neweix-shop-api:ci .
